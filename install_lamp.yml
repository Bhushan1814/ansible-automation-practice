# lamp -> httpd, mariadb, php
--- 
- name: Install LAMP stack
  hosts: localhost
  become: true
  tasks:
    - name: Install Apache (httpd)
      ansible.builtin.yum:
        name: httpd
        state: present

    - name: Start and enable Apache service
      ansible.builtin.systemd_service:
        name: httpd
        state: started
        enabled: true

    - name: Install mariaDB 
      ansible.builtin.yum:
        name: mariadb105-server
        state: present

    - name: Start and enable MariaDB service
      ansible.builtin.systemd_service:
        name: mariadb
        state: started
        enabled: true

    - name: Install PHP 
      ansible.builtin.yum:
        name: php
        state: present

    - name: Start and enable PHP service
      ansible.builtin.systemd_service:
        name: php-fpm
        state: started
        enabled: true

    - name: Restart Apache to apply PHP changes
      ansible.builtin.service:
        name: httpd
        state: restarted
    
    # deploy index.php to /var/www/html
    - name: Deploy index.php
      ansible.builtin.copy:
        dest: /var/www/html/index.php    
        content: |
          <?php
          phpinfo();
          ?>