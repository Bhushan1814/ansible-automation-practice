# deploy nginx webserver with a handler block 
---
- name: Deploy Nginx webserver without handler
  hosts: webservers
  become: true
  vars:
    pkg_name: nginx
    service_name: nginx
    default_file_path: /usr/share/nginx/html/index.html
    conf_file_path: /etc/nginx/conf.d/custom.conf # use this file when you to pass the configuration dynamically

  tasks:
    - name: Install Nginx
      ansible.builtin.yum:
        name: "{{ pkg_name }}"
        state: present

    - name: Ensure Nginx is running
      ansible.builtin.systemd_service:
        name: "{{ service_name }}"
        state: started
        enabled: true

    - name: add server block in nginx configuration file
      ansible.builtin.blockinfile:
        path: "{{ conf_file_path }}"
        create: yes
        block: |
          server {
              listen 82;
              server_name example.com;
              root {{default_file_path}};
              index index.html;
          }
        notify: restart nginx service # added notification handler to restart nginx service when configuration file is changed

    - name: deploy application content
      ansible.builtin.copy:
        dest: "{{ default_file_path }}"
        content: "<h1>Playbook with handler block</h1>"
  
  # define handlers at the bottom of the file/playbook
  handlers:
    - name: restart nginx service
      ansible.builtin.systemd_service:
        name: "{{ service_name }}"
        state: restarted  